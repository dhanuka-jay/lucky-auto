<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Lucky Auto</title>

<body>
    <div class="wrapper">
        <div class="new-car-form">
            <form action="">
                <h1>Add New Car</h1>
                <div class="input-box">
                    <input class="upper" placeholder="Rego" type="text" />
                    <i class='bx  bx-car'></i>
                </div>

                <div class="input-box">
                    <input placeholder="Year" type="number" />
                    <i class='bx  bx-calendar-alt'></i> 
                </div>

                <div class="input-box">
                    <input placeholder="Owner Name" type="text" />   
                    <i class='bx  bx-user'></i>
                </div>

                <div class="input-box">
                    <input placeholder="Phone" type="number" />   
                    <i class='bx  bx-phone'></i> 
                </div>

                <div class="input-box">
                    <input placeholder="Email" type="email" />   
                    <i class='bx  bx-at'></i>
                </div>

                <div class="input-box">
                    <input placeholder="Address" type="text" />   
                    <i class='bx  bx-location-alt-2'></i> 
                </div>

                <button class="btn">Add Car</button>
            </form>
        </div>
    </div>
